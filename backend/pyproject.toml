[project]
name = "mortgageeval-backend"
version = "0.1.0"
description = "FastAPI backend for MortgageEval — AI mortgage assistant with RAG and LangGraph agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.0",
    "pydantic-settings==2.2.1",
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "redis==5.0.4",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "langchain==0.2.1",
    "langchain-openai==0.1.8",
    "langchain-community==0.2.1",
    "langchain-qdrant==0.1.1",
    "langgraph==0.1.1",
    "langfuse==2.36.2",
    "openai==1.30.1",
    "qdrant-client==1.9.1",
    "tiktoken==0.7.0",
    "mlflow==2.13.0",
    "python-dotenv==1.0.1",
    "structlog==24.1.0",
    "pypdf==4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
