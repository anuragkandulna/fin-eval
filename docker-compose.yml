version: '3.8'

# PostgreSQL is hosted on Azure Database for PostgreSQL – Flexible Server (free tier).
# Set DATABASE_URL and MLFLOW_DB_URL in .env — no local postgres container needed.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./evals/reports:/app/reports
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  test-dashboard:
    build: ./test-dashboard
    ports:
      - "3001:80"
    environment:
      - VITE_GITHUB_REPO=${GITHUB_REPO}
      - VITE_GITHUB_TOKEN=${GITHUB_TOKEN}
      - VITE_BACKEND_URL=http://backend:8000
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    command: >
      bash -c "pip install mlflow -q &&
               mlflow server
               --backend-store-uri sqlite:////mlflow/data/mlflow.db
               --default-artifact-root /mlflow/artifacts
               --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow/data
      - mlflow_artifacts:/mlflow/artifacts
    restart: unless-stopped

volumes:
  mlflow_data:
  mlflow_artifacts:
