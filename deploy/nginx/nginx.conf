# FinEval VPS Nginx — reverse proxy config
# SSL termination via Certbot. Replace DOMAIN_NAME with the actual domain
# and run: certbot --nginx -d app.DOMAIN_NAME -d mlflow.DOMAIN_NAME

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name app.DOMAIN_NAME mlflow.DOMAIN_NAME;
    return 301 https://$host$request_uri;
}

# Main app — routes to frontend container (which proxies API calls to backend)
server {
    listen 443 ssl;
    server_name app.DOMAIN_NAME;

    ssl_certificate     /etc/letsencrypt/live/app.DOMAIN_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.DOMAIN_NAME/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# MLflow tracking server
server {
    listen 443 ssl;
    server_name mlflow.DOMAIN_NAME;

    ssl_certificate     /etc/letsencrypt/live/mlflow.DOMAIN_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mlflow.DOMAIN_NAME/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://mlflow:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
