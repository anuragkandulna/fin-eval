services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_FRONTEND_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_IMAGE}:${IMAGE_TAG:-latest}
    container_name: fineval-app
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mlflow:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_MLFLOW_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - mlflow_data:/mlflow

volumes:
  mlflow_data:
