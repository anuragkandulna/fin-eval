[project]
name = "test-framework"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "deepeval>=1.4.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
    "pytest-html>=4.1",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.44",
    "allure-pytest>=2.13",
]
