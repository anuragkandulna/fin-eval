# Local development overlay — hot reload for backend and frontend.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up

services:
  backend:
    volumes:
      - ./backend:/app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=local

  frontend:
    build:
      context: ./frontend
      target: builder        # Node stage — run dev server instead of Nginx
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
