[project]
name = "fineval"
version = "0.1.0"
description = "FinEval monorepo Python environment for the backend and test framework"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic>=2.7.4,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "sqlalchemy==2.0.30",
    "aioodbc>=0.5.0,<1.0.0",
    "pyodbc>=5.1.0,<6.0.0",
    "alembic==1.13.1",
    "redis==5.0.4",
    "python-multipart==0.0.9",
    "httpx>=0.27.0,<1.0.0",
    "langchain>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langchain-qdrant>=0.2.0,<0.3.0",
    "langgraph>=0.2.0,<0.3.0",
    "langfuse>=2.36.2,<3.0.0",
    "openai>=1.30.1,<2.0.0",
    "qdrant-client>=1.9.1,<2.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "mlflow>=2.13.0,<3.0.0",
    "python-dotenv==1.0.1",
    "structlog>=24.1.0,<25.0.0",
    "pypdf>=4.2.0,<5.0.0",
    "docx2txt>=0.8,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
test-framework = [
    "aiohttp==3.9.5",
    "allure-pytest==2.13.5",
    "allure-python-commons==2.13.5",
    "jinja2==3.1.4",
    "pandas==2.2.2",
    "playwright==1.44.0",
    "pytest-json-report==1.5.0",
    "pytest-playwright==0.5.0",
    "rich==13.7.1",
]

[tool.uv]
package = false
