name: Build And Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: fineval-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fineval-app
          cache-to: type=gha,mode=max,scope=fineval-app

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -eu
            mkdir -p "${{ secrets.HOSTINGER_DEPLOY_PATH }}"

      - name: Copy deployment manifest to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          source: deploy/hostinger/docker-compose.yml
          target: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          strip_components: 2
          overwrite: true

      - name: Deploy on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_IMAGE: ${{ env.IMAGE_NAME }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          envs: GHCR_OWNER,GHCR_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            mkdir -p "${{ secrets.HOSTINGER_DEPLOY_PATH }}"
            cd "${{ secrets.HOSTINGER_DEPLOY_PATH }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            GHCR_OWNER="$GHCR_OWNER" GHCR_IMAGE="$GHCR_IMAGE" docker compose pull
            GHCR_OWNER="$GHCR_OWNER" GHCR_IMAGE="$GHCR_IMAGE" docker compose up -d
            docker image prune -f
